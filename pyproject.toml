[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nalmeok"
version = "0.6.3"
description = "Gemini Batch·무료 live로 강의 음성을 저렴하게 전사하는 도구"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "google-genai>=2.31.0,<3",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[project.scripts]
nalmeok = "nalmeok:cli"

[tool.setuptools]
packages = ["nalmeok"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# CI가 검사하는 규칙. 기본 규칙(E4·E7·E9·F)을 명시해 개인 설정과 무관하게 같게 둡니다.
select = ["E4", "E7", "E9", "F"]
