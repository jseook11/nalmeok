name: Windows

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Run unit tests
        run: go test ./...

  build:
    name: Build Windows executables
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build executables
        run: scripts/build_windows_app.sh
      - name: Check executables
        run: |
          test -s build/windows/Nalmeok.exe
          test -s build/windows/Nalmeok-arm64.exe
      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: nalmeok-windows-unsigned-${{ github.sha }}
          path: |
            build/windows/Nalmeok.exe
            build/windows/Nalmeok-arm64.exe
          if-no-files-found: error
          retention-days: 14
