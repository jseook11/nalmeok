name: macOS

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (macOS)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Vet
        run: go vet ./...
      - name: Run unit tests
        run: go test ./...

  build:
    name: Build macOS app
    runs-on: macos-15
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build unsigned app
        run: scripts/build_mac_app.sh
      - name: Smoke-test the bundle
        run: |
          build/nalmeok --version
          build/Nalmeok.app/Contents/MacOS/nalmeok --version
          archs=$(lipo -archs build/Nalmeok.app/Contents/MacOS/nalmeok)
          echo "$archs" | grep -qw x86_64
          echo "$archs" | grep -qw arm64
      - name: Upload unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: nalmeok-macos-unsigned-${{ github.sha }}
          path: build/Nalmeok.app
          if-no-files-found: error
          retention-days: 14
