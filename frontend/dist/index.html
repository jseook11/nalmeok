<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nalmeok</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app" class="is-empty">
  <header class="topbar">
    <div class="topbar-side"></div>
    <div class="topbar-center">
      <!-- Free-tier health: drawn over the Free segment's left edge, but its
           own control so pointing at it never switches the mode. -->
      <button class="health-dot" id="health-dot" type="button" aria-haspopup="dialog" aria-expanded="false"
              aria-controls="health-pop" hidden><i class="dot"></i></button>
      <div class="segmented" id="mode-toggle" role="tablist" data-i18n-aria-label="mode.label" hidden>
        <button type="button" role="tab" data-mode="free" aria-selected="true" data-i18n="tier.free"></button>
        <button type="button" role="tab" data-mode="batch" aria-selected="false" data-i18n="tier.paid"></button>
      </div>
      <button class="picker-button" id="key-picker" type="button" aria-haspopup="menu" aria-expanded="false"
              data-i18n-aria-label="picker.title" data-i18n-title="picker.title" hidden>
        <span class="picker-label" id="key-picker-label" data-i18n="picker.auto"></span>
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor"
             stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m2 3.5 3 3 3-3"/>
        </svg>
      </button>
    </div>
    <div class="topbar-side topbar-tools">
      <button class="tool-button" id="add" type="button" data-i18n-aria-label="action.addFile" data-i18n-title="action.addFile">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <path d="M8 3v10M3 8h10"/>
        </svg>
      </button>
      <button class="tool-button" id="pane-toggle" type="button" aria-pressed="false"
              data-i18n-aria-label="pane.toggle" data-i18n-title="pane.toggle">
        <svg width="18" height="16" viewBox="0 0 18 16" fill="none" stroke="currentColor"
             stroke-width="1.3" stroke-linejoin="round" aria-hidden="true">
          <rect x="1.5" y="2.5" width="15" height="11" rx="2.5"/>
          <path d="M10.5 2.5v11"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="side">
    <div class="search-row">
    <label class="search">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor"
           stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
        <circle cx="7" cy="7" r="4.6"/>
        <path d="m10.5 10.5 3 3"/>
      </svg>
      <input id="search" type="search" data-i18n-placeholder="search.placeholder" autocomplete="off" spellcheck="false"
             data-i18n-aria-label="search.placeholder">
    </label>
    <button class="tool-button" id="group-button" type="button" aria-haspopup="menu" aria-expanded="false"
            data-i18n-aria-label="group.label" data-i18n-title="group.label">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor"
           stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
        <path d="M2.5 4h11M4.5 8h7M6.5 12h3"/>
      </svg>
    </button>
    </div>
    <div class="list" id="list" role="listbox" tabindex="0" data-i18n-aria-label="list.label"></div>
    <button class="empty" id="empty" type="button" data-i18n-aria-label="empty.label">
      <span id="empty-text" data-i18n="empty.text"></span>
    </button>
    <button class="health-row" id="health-row" type="button" aria-haspopup="dialog" aria-expanded="false"
            aria-controls="health-pop" hidden>
      <i class="dot"></i>
      <span class="health-row-label" id="health-row-label"></span>
      <span class="health-row-rate" id="health-row-rate"></span>
    </button>
  </main>

  <section class="pane" id="pane">
    <header class="pane-head" id="pane-head"></header>
    <div class="pane-body" id="pane-body" role="region" tabindex="0" data-i18n-aria-label="pane.label"></div>
  </section>

  <footer class="footer">
    <button class="foot-text" id="sort-courses" type="button" hidden></button>
    <button class="foot-button" id="help" type="button" data-i18n-aria-label="help.title" data-i18n-title="help.title">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor"
           stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5.6 5.6a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.2.9-1.2 1.7v.6"/>
        <circle cx="8" cy="12.6" r=".5" fill="currentColor" stroke="none"/>
      </svg>
    </button>
    <button class="foot-button" id="gear" type="button" data-i18n-aria-label="settings.title" data-i18n-title="settings.title">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 8.9 4.6 1.7 1.7 0 0 0 9.93 3.04V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 8.9c.2.62.78 1.03 1.56 1.03H21a2 2 0 1 1 0 4h-.09c-.7 0-1.3.4-1.51 1.07Z"/>
      </svg>
    </button>
  </footer>
</div>

<div class="sheet" id="keys-sheet" role="dialog" aria-modal="true" aria-labelledby="keys-title" tabindex="-1" hidden>
  <header class="sheet-head">
    <h2 id="keys-title" data-i18n="settings.title"></h2>
    <button class="text-button" type="button" data-close data-i18n="sheet.done"></button>
  </header>
  <div class="sheet-body">
    <div class="segmented settings-tabs" id="settings-tabs" role="tablist" data-i18n-aria-label="settings.title">
      <button type="button" role="tab" id="tab-timetable" data-tab="timetable" aria-controls="pane-timetable" aria-selected="true" data-i18n="timetable.label"></button>
      <button type="button" role="tab" id="tab-keys" data-tab="keys" aria-controls="pane-keys" aria-selected="false" tabindex="-1" data-i18n="settings.keysTab"></button>
    </div>
    <div class="settings-pane" id="pane-timetable" role="tabpanel" aria-labelledby="tab-timetable">
      <div class="setting courses-setting" id="courses-setting">
        <form class="entry-form" id="entry-form" novalidate>
          <input class="field" id="entry" type="text" autocomplete="off" spellcheck="false"
                 aria-describedby="entry-help" data-i18n-placeholder="timetable.entryPlaceholder"
                 data-i18n-aria-label="timetable.entryLabel">
          <button class="primary-button entry-add" id="entry-add" type="submit" data-i18n="timetable.entryAdd"></button>
          <button class="info-button" id="entry-about" type="button" aria-expanded="false" aria-controls="entry-help"
                  data-i18n-aria-label="timetable.entryAbout" data-i18n-title="timetable.entryTip">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor"
                 stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="8" cy="8" r="6.4"/>
              <path d="M6.3 6.3a1.75 1.75 0 1 1 2.5 1.6c-.5.3-.8.6-.8 1.2v.3"/>
              <circle cx="8" cy="11.3" r=".35" fill="currentColor" stroke="none"/>
            </svg>
          </button>
        </form>
        <div class="entry-help" id="entry-help" hidden>
          <p data-i18n="timetable.help.intro"></p>
          <ul>
            <li><code data-i18n="timetable.help.ex1"></code></li>
            <li><code data-i18n="timetable.help.ex2"></code> <span data-i18n="timetable.help.ex2note"></span></li>
            <li><code data-i18n="timetable.help.ex3"></code> <span data-i18n="timetable.help.ex3note"></span></li>
            <li><code data-i18n="timetable.help.ex4"></code> <span data-i18n="timetable.help.ex4note"></span></li>
            <li><code data-i18n="timetable.help.ex5"></code> <span data-i18n="timetable.help.ex5note"></span></li>
          </ul>
          <p data-i18n="timetable.help.rules"></p>
        </div>
        <p class="setting-note" data-i18n="timetable.note"></p>
        <div class="timetable" id="timetable" role="group" data-i18n-aria-label="timetable.label"></div>
        <div class="tt-legend" id="tt-legend"></div>
        <div class="setting-row semester-row">
          <label class="setting-label" for="semester-start" data-i18n="courses.semester"></label>
          <input class="field field-date" id="semester-start" type="text" inputmode="numeric" spellcheck="false"
                 data-i18n-placeholder="courses.semesterPlaceholder">
        </div>
        <p class="setting-note" data-i18n="courses.semesterNote"></p>
      </div>
    </div>
    <div class="settings-pane" id="pane-keys" role="tabpanel" aria-labelledby="tab-keys" hidden>
      <p class="sheet-intro" id="keys-intro" hidden>
        <span data-i18n="keys.intro"></span>
        <button class="text-button" id="key-source" type="button" data-i18n="keys.source"></button>
      </p>
      <p class="key-caption" id="key-caption" data-i18n="keys.caption" hidden></p>
      <div class="key-list" id="key-list"></div>
      <form class="key-form" id="key-form" novalidate>
        <div class="segmented segmented-small" id="key-tier" role="tablist" data-i18n-aria-label="keys.tier">
          <button type="button" role="tab" data-tier="free" aria-selected="true" data-i18n="tier.free"></button>
          <button type="button" role="tab" data-tier="paid" aria-selected="false" data-i18n="tier.paid"></button>
        </div>
        <input class="field" id="key-value" type="password" data-i18n-placeholder="keys.placeholder"
               autocomplete="new-password" spellcheck="false" data-i18n-aria-label="keys.title">
        <p class="form-error" id="key-error" role="alert" hidden></p>
        <button class="primary-button" id="key-save" type="submit" data-i18n="keys.save"></button>
      </form>
      <div class="setting" id="signals-setting" hidden>
        <div class="setting-row">
          <label class="setting-label" for="signals-switch" data-i18n="signals.label"></label>
          <button class="info-button" id="signals-about" type="button" aria-expanded="false" aria-controls="signals-body"
                  data-i18n-aria-label="signals.about" data-i18n-title="signals.about">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor"
                 stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="8" cy="8" r="6.4"/>
              <path d="M6.3 6.3a1.75 1.75 0 1 1 2.5 1.6c-.5.3-.8.6-.8 1.2v.3"/>
              <circle cx="8" cy="11.3" r=".35" fill="currentColor" stroke="none"/>
            </svg>
          </button>
          <input class="switch" id="signals-switch" type="checkbox" role="switch">
        </div>
        <p class="setting-note" id="signals-body" data-i18n="signals.body" hidden></p>
      </div>
    </div>
  </div>
</div>

<div class="slot-layer" id="slot-layer" hidden>
  <form class="slot-pop" id="slot-pop" role="dialog" aria-modal="true" aria-labelledby="slot-title" tabindex="-1" novalidate>
    <h3 class="slot-title" id="slot-title"></h3>
    <label class="slot-label" for="slot-course" data-i18n="timetable.course"></label>
    <div class="slot-combo">
      <input class="field" id="slot-course" type="text" role="combobox" aria-autocomplete="list"
             aria-expanded="false" aria-controls="slot-suggest" autocomplete="off" spellcheck="false"
             data-i18n-placeholder="courses.namePlaceholder">
      <div class="slot-suggest" id="slot-suggest" role="listbox" data-i18n-aria-label="timetable.course" hidden></div>
    </div>
    <p class="setting-note slot-new-note" id="slot-new-note" aria-live="polite" hidden></p>
    <span class="slot-label" id="slot-days-label" data-i18n="timetable.days"></span>
    <div class="slot-days" id="slot-days" role="group" aria-labelledby="slot-days-label"></div>
    <span class="slot-label" id="slot-time-label" data-i18n="timetable.time"></span>
    <div class="slot-times" role="group" aria-labelledby="slot-time-label">
      <input class="field slot-time" id="slot-start" type="time" step="300" data-i18n-aria-label="timetable.start">
      <span aria-hidden="true">–</span>
      <select class="field slot-time" id="slot-end" data-i18n-aria-label="timetable.end"></select>
    </div>
    <p class="form-error" id="slot-error" role="alert" hidden></p>
    <div class="modal-actions slot-actions">
      <button class="slot-delete" id="slot-delete" type="button" data-i18n="timetable.delete"></button>
      <button class="secondary-button" id="slot-cancel" type="button" data-i18n="timetable.cancel"></button>
      <button class="primary-button" id="slot-save" type="submit" data-i18n="timetable.save"></button>
    </div>
  </form>
</div>

<div class="sheet" id="help-sheet" role="dialog" aria-modal="true" aria-labelledby="help-title" tabindex="-1" hidden>
  <header class="sheet-head">
    <h2 id="help-title" data-i18n="help.title"></h2>
    <button class="text-button" type="button" data-close data-i18n="sheet.done"></button>
  </header>
  <div class="sheet-body">
    <dl class="help">
      <dt data-i18n="help.result"></dt>
      <dd data-i18n="help.resultBody"></dd>
      <dt data-i18n="tier.free"></dt>
      <dd data-i18n="help.freeBody"></dd>
      <dt data-i18n="tier.paid"></dt>
      <dd data-i18n="help.paidBody"></dd>
      <dt data-i18n="help.formats"></dt>
      <dd data-i18n="help.formatsBody"></dd>
      <dt data-i18n="help.next"></dt>
      <dd>
        <span data-i18n="help.nextBody"></span>
        <button class="text-button" id="help-prompts" type="button" data-i18n="help.prompts"></button>
      </dd>
    </dl>
  </div>
</div>

<div class="modal" id="pdf-sheet" role="dialog" aria-modal="true" aria-labelledby="pdf-title" hidden>
  <form class="modal-card" id="pdf-form" tabindex="-1" novalidate>
    <h2 class="modal-title" id="pdf-title" data-i18n="pdf.title"></h2>
    <p class="modal-sub" id="pdf-sub"></p>
    <div class="pdf-list" id="pdf-list"></div>
    <button class="plain-option" id="pdf-none" type="button" data-i18n="pdf.none"></button>
    <div class="modal-actions">
      <button class="secondary-button" id="pdf-cancel" type="button" data-i18n="pdf.cancel"></button>
      <button class="primary-button" id="pdf-start" type="submit" data-i18n="pdf.start"></button>
    </div>
  </form>
</div>

<div class="modal" id="quit-sheet" role="alertdialog" aria-modal="true" aria-labelledby="quit-title" aria-describedby="quit-sub" hidden>
  <form class="modal-card" id="quit-form" tabindex="-1" novalidate>
    <h2 class="modal-title" id="quit-title" data-i18n="quit.title"></h2>
    <p class="modal-sub" id="quit-sub" data-i18n="quit.message"></p>
    <div class="modal-actions">
      <button class="secondary-button" id="quit-confirm" type="button" data-i18n="quit.confirm"></button>
      <button class="primary-button" id="quit-keep" type="submit" data-i18n="quit.keep"></button>
    </div>
  </form>
</div>

<div class="menu" id="menu" role="menu" tabindex="-1" hidden></div>

<div class="popover health-pop" id="health-pop" role="dialog" tabindex="-1" aria-labelledby="health-pop-title" hidden>
  <p class="health-pop-title" id="health-pop-title"><i class="dot"></i><span id="health-pop-level"></span></p>
  <p class="health-pop-line" id="health-pop-success"></p>
  <p class="health-pop-line" id="health-pop-fake" hidden></p>
  <button class="text-button" id="health-pop-link" type="button" data-i18n="health.statusPage"></button>
</div>

<div class="toast" id="toast">
  <span id="toast-text"></span>
  <button class="toast-action" id="toast-action" type="button" data-i18n="toast.undo" hidden></button>
</div>

<!-- The only live regions; app.js writes them through announce(). -->
<div class="visually-hidden" id="announce-polite" aria-live="polite"></div>
<div class="visually-hidden" id="announce-assertive" aria-live="assertive"></div>

<script src="app.js"></script>
</body>
</html>
