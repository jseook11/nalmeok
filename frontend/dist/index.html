<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nalmeok</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app" class="is-empty">
  <header class="chrome">
    <div class="topbar">
      <div class="topbar-center">
        <div class="segmented" id="mode-toggle" role="tablist" data-i18n-aria-label="mode.label" hidden>
          <button type="button" role="tab" data-mode="free" aria-selected="true" data-i18n="tier.free"></button>
          <button type="button" role="tab" data-mode="batch" aria-selected="false" data-i18n="tier.paid"></button>
        </div>
        <button class="picker-button" id="key-picker" type="button" aria-haspopup="menu"
                data-i18n-aria-label="picker.title" data-i18n-title="picker.title" hidden>
          <span class="picker-label" id="key-picker-label" data-i18n="picker.auto"></span>
          <svg width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="currentColor"
               stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m2 3.5 3 3 3-3"/>
          </svg>
        </button>
      </div>
      <button class="tool-button add-button" id="add" type="button" data-i18n-aria-label="action.addFile" data-i18n-title="action.addFile">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <path d="M8 3v10M3 8h10"/>
        </svg>
      </button>
    </div>
    <label class="search">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
        <circle cx="7" cy="7" r="4.6"/>
        <path d="m10.5 10.5 3 3"/>
      </svg>
      <input id="search" type="search" data-i18n-placeholder="search.placeholder" autocomplete="off" spellcheck="false"
             data-i18n-aria-label="search.placeholder">
    </label>
  </header>

  <main class="list" id="list"></main>

  <button class="empty" id="empty" type="button" data-i18n-aria-label="empty.label">
    <svg class="empty-glyph" width="56" height="28" viewBox="0 0 64 32" fill="none" aria-hidden="true">
      <rect x="4" y="12" width="3.4" height="8" rx="1.7" fill="currentColor"/>
      <rect x="13" y="8" width="3.4" height="16" rx="1.7" fill="currentColor"/>
      <rect x="22" y="3" width="3.4" height="26" rx="1.7" fill="currentColor"/>
      <rect x="31" y="6" width="3.4" height="20" rx="1.7" fill="currentColor"/>
      <rect x="40" y="2" width="3.4" height="28" rx="1.7" fill="currentColor"/>
      <rect x="49" y="10" width="3.4" height="12" rx="1.7" fill="currentColor"/>
      <rect x="58" y="13" width="3.4" height="6" rx="1.7" fill="currentColor"/>
    </svg>
    <span data-i18n="empty.text"></span>
  </button>

  <footer class="footer">
    <button class="round-button" id="help" type="button" data-i18n-aria-label="help.title" data-i18n-title="help.title">?</button>
    <button class="round-button" id="gear" type="button" data-i18n-aria-label="keys.title" data-i18n-title="keys.title">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 8.9 4.6 1.7 1.7 0 0 0 9.93 3.04V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 8.9c.2.62.78 1.03 1.56 1.03H21a2 2 0 1 1 0 4h-.09c-.7 0-1.3.4-1.51 1.07Z"/>
      </svg>
    </button>
  </footer>
</div>

<div class="sheet" id="keys-sheet" role="dialog" aria-modal="true" aria-labelledby="keys-title" hidden>
  <header class="sheet-head">
    <h2 id="keys-title" data-i18n="keys.title"></h2>
    <button class="text-button" type="button" data-close data-i18n="sheet.done"></button>
  </header>
  <div class="sheet-body">
    <p class="sheet-intro" id="keys-intro" hidden>
      <span data-i18n="keys.intro"></span>
      <button class="text-button" id="key-source" type="button" data-i18n="keys.source"></button>
    </p>
    <p class="key-caption" id="key-caption" data-i18n="keys.caption" hidden></p>
    <div class="key-list" id="key-list"></div>
    <form class="key-form" id="key-form" novalidate>
      <div class="segmented segmented-small" id="key-tier" role="tablist" data-i18n-aria-label="keys.tier">
        <button type="button" role="tab" data-tier="free" aria-selected="true" data-i18n="tier.free"></button>
        <button type="button" role="tab" data-tier="paid" aria-selected="false" data-i18n="tier.paid"></button>
      </div>
      <input class="field" id="key-value" type="password" data-i18n-placeholder="keys.placeholder"
             autocomplete="new-password" spellcheck="false" data-i18n-aria-label="keys.title">
      <p class="form-error" id="key-error" role="alert" hidden></p>
      <button class="primary-button" id="key-save" type="submit" data-i18n="keys.save"></button>
    </form>
  </div>
</div>

<div class="sheet" id="help-sheet" role="dialog" aria-modal="true" aria-labelledby="help-title" hidden>
  <header class="sheet-head">
    <h2 id="help-title" data-i18n="help.title"></h2>
    <button class="text-button" type="button" data-close data-i18n="sheet.done"></button>
  </header>
  <div class="sheet-body">
    <dl class="help">
      <dt data-i18n="help.result"></dt>
      <dd data-i18n="help.resultBody"></dd>
      <dt data-i18n="tier.free"></dt>
      <dd data-i18n="help.freeBody"></dd>
      <dt data-i18n="tier.paid"></dt>
      <dd data-i18n="help.paidBody"></dd>
      <dt data-i18n="help.formats"></dt>
      <dd data-i18n="help.formatsBody"></dd>
    </dl>
  </div>
</div>

<div class="menu" id="menu" role="menu" hidden></div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toast-text"></span>
  <button class="toast-action" id="toast-action" type="button" data-i18n="toast.undo" hidden></button>
</div>

<script src="app.js"></script>
</body>
</html>
